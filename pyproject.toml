[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvm"
version = "0.1.0.dev0"
description = "Dynamic Viewport Media: draft, unofficial tools for time-varying viewports over a fixed encoded canvas"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
dvm = "dvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
